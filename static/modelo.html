<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelo 3D — DCYM Rastreador V1</title>
<meta name="theme-color" content="#050a07">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dcym.css?v=13">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .visor { flex: 1; border-radius: 0; border: 0; min-height: 0; }
  .visor-list { max-height: none; }
  .visor-stage { min-height: 0; aspect-ratio: auto; }
  @media (max-width: 900px) { body { height: auto; } .visor-stage { aspect-ratio: 1 / 1.05; } }
  body.render { background: transparent; }
  body.render .appbar, body.render .visor-side, body.render .visor-tools, body.render .visor-hint { display: none; }
  body.render .visor-stage { background: transparent; }
  body.render .visor { grid-template-columns: 1fr; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="appbar">
  <div class="wrap" style="width:calc(100% - 32px)">
    <a href="/" class="brand"><span class="brand-mark" data-brand-icon></span><span class="brand-name">DCYM<small>RASTREADOR V1 · MODELO 3D</small></span></a>
    <a href="/#prototipo" class="btn btn-ghost btn-sm">Volver</a>
  </div>
</header>
<div class="visor card" id="visor">
  <div class="visor-stage" data-canvas>
    <div class="visor-hint">Arrastra para girar · toca una pieza</div>
    <div class="visor-tip" data-tip></div>
    <div class="visor-tools">
      <button type="button" data-act="explode" aria-pressed="false">Vista explosionada</button>
      <button type="button" data-act="spin" aria-pressed="false">Hélices</button>
      <button type="button" data-act="rotate" aria-pressed="true">Girar solo</button>
      <button type="button" data-act="reset">Centrar</button>
    </div>
  </div>
  <aside class="visor-side">
    <div class="visor-info" data-info>
      <span class="visor-kicker">DCYM Rastreador V1</span>
      <h4>Cuadricóptero de 650 mm</h4>
      <p>Modelo a escala con las piezas reales. Toca cualquier pieza o elígela en la lista.</p>
    </div>
    <ul class="visor-list" data-list></ul>
  </aside>
</div>
<script src="/static/js/common.js?v=7"></script>
<script type="module">
  import { mountVisor } from "/static/js/visor.js?v=13";
  const q = new URLSearchParams(location.search);
  const render = q.has("render");
  if (render) document.body.classList.add("render");
  const v = mountVisor(document.getElementById("visor"), render
    ? { interactive: false, autoRotate: false, transparent: true, preserve: true, static: true, exploded: q.has("explode") }
    : { zoom: true });
  if (v && render) {
    const [x, y, z] = (q.get("cam") || "9.5,5.2,10.5").split(",").map(Number);
    v.camera.position.set(x, y, z);
    if (q.get("sel")) v.select(q.get("sel"));
    if (q.get("only")) { v.only(q.get("only")); v.controls.target.set(...(q.get("target") || "0,0,0").split(",").map(Number)); }
    setTimeout(() => { v.renderOnce(); document.body.dataset.ready = "1"; }, 600);
  }
  window.__visor = v;
</script>
</body>
</html>
